# Setup
title:               Daniel Meier
tagline:             'Infrastructure, Linux, automation, and operational engineering'
description:         ''
url:                 https://dme86.github.io
baseurl:             ''
paginate:            5
permalink:           pretty

# About/contact
author:
  name:              Dan 'dme' Meier
  url:
  email:

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate

# DME theme
theme_name:          DME
theme_version:       1.0.0
google_analytics_id: #UA-XXXX-Y
excerpt_separator: <!-- more -->

# German articles are a separate collection so English pagination and feeds stay intact.
lang: en
collections:
  de:
    output: true
defaults:
  - scope:
      path: ""
    values:
      lang: en
  - scope:
      path: ""
      type: de
    values:
      lang: de
      layout: post
      excerpt_separator: "<!--more-->"
